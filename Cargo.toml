[package]
name = "self26"
version = "0.1.3"
edition = "2021"
rust-version = "1.88.0"
license = "AGPL-3.0-only"
description = "A self-hosted, e621-compatible media server with a Rust backend and Flutter web UI."
repository = "https://gitlab.com/HttpAnimations/self26"
homepage = "https://gitlab.com/HttpAnimations/self26"

[[bin]]
name = "self26"
path = "src/main.rs"

[lib]
name = "self26"
path = "src/lib.rs"

[workspace]
resolver = "2"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "set-header", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
include_dir = "0.7"
mime_guess = "2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
md5 = "0.7"
hex = "0.4"
base64 = "0.22"
argon2 = "0.5"
rand = "0.8"
subtle = "2.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
percent-encoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
